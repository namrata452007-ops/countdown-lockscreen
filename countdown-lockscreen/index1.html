<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!--YOUR LOCK SCREEN CONTENT WILL GO HERE-->


    <div class="lock-screen-container">
    
    <!-- Lock Screen Header -->
    <header class="lock-header">
        <h1>🔒 Locked Until</h1>
        <p class="target-date">November 23, 2026</p>
    </header>

    <!-- Countdown Timer Display Area -->
    <div class="countdown-timer">
        <div class="time-box">
            <span id="days" class="time-value">00</span>
            <span class="time-label">Days</span>
        </div>
        <div class="time-box">
            <span id="hours" class="time-value">00</span>
            <span class="time-label">Hours</span>
        </div>
        <div class="time-box">
            <span id="minutes" class="time-value">00</span>
            <span class="time-label">Minutes</span>
        </div>
        <div class="time-box">
            <span id="seconds" class="time-value">00</span>
            <span class="time-label">Seconds</span>
        </div>
    </div>

    <!-- Unlock / Input Area -->
    <div class="unlock-section">
        <input type="password" id="passcode-input" placeholder="Enter passcode to unlock..." />
        <button id="unlock-btn">Unlock</button>
    </div>

<div class="unlock-section">
            <input type="password" id="passcode-input" placeholder="Enter passcode to unlock..." />
            <button id="unlock-btn">Unlock</button>
        </div>

    </div>

    <!-- Add your script link right here -->

</div>
</body>
</html>
